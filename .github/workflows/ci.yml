name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify RAW entry points
        run: python3 decompiled/verify_raw_entries.py
      - name: Check inventory, annotations, and README sync
        run: python3 tools/progress.py --check --check-readme
      - name: Run progress engine unit tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Dry-run dashboard and SVG generation
        run: |
          python3 tools/progress.py "$RUNNER_TEMP/progress"
          for f in progress.json progress.svg badge-decompiled.svg badge-lifted.svg badge-tests.svg progress.html; do
            test -s "$RUNNER_TEMP/progress/$f"
          done

  build-and-test-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-zlib
      - name: Add MSYS2 UCRT64 toolchain to PATH
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:MSYS2_LOCATION\ucrt64\bin"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:MSYS2_LOCATION\usr\bin"
      - name: Build and test decompiled/Compilable
        shell: bash
        run: mingw32-make -C decompiled/Compilable test
      - name: Build and test lifted engine (headless SDL2)
        shell: bash
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy mingw32-make -C lifted test
