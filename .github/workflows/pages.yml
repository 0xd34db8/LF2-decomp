name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'decompiled/**'
      - 'lifted/src/**'
      - 'tools/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate progress dashboard and history
        run: |
          python3 tools/progress.py _site
          python3 tools/progress_history.py _site
          cp _site/progress.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
